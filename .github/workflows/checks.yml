name: Project checks
on:
  pull_request:
  push:
    branches: [main, 'feat/backend-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:backend
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:http
