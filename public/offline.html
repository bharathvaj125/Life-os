<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline · LiFE-OS</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbf8f3; color: #0b2519; font-family: system-ui, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
      main { max-width: 420px; }
      h1 { font-size: 26px; margin: 0 0 12px; }
      p { line-height: 1.55; margin: 0 0 20px; color: #3d4f45; }
      button { font: inherit; font-weight: 650; background: #d97724; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>LiFE-OS needs an internet connection to load your household. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
